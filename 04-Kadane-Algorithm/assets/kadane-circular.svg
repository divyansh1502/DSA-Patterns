<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="440" viewBox="0 0 800 440" role="img" aria-label="Circular maximum subarray: answer is the larger of normal Kadane and total minus the minimum subarray" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Circular maximum subarray: answer is the larger of normal Kadane and total minus the minimum subarray</title>
<style>.in{animation:in .7s cubic-bezier(.2,.8,.3,1) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.pu{transform-box:fill-box;transform-origin:center;animation:pu 1.4s ease-in-out infinite}
@keyframes pu{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.7);opacity:.4}}
.dash{animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
.blk{animation:bk 1s steps(1) infinite}
@keyframes bk{0%,100%{opacity:1}50%{opacity:0}}
.sh{transform-box:fill-box;transform-origin:center;animation:sh 3.6s ease-in-out infinite}
@keyframes sh{0%{transform:translateX(-40px) skewX(-20deg)}55%,100%{transform:translateX(var(--t)) skewX(-20deg)}}
@media (prefers-reduced-motion:reduce){.in,.pu,.dash,.blk,.sh{animation:none}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#021208"/><stop offset=".55" stop-color="#052e1a"/><stop offset="1" stop-color="#03150b"/></linearGradient>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c6ff00"/><stop offset="1" stop-color="#00e676"/></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f8d46" stop-opacity="0"/><stop offset=".5" stop-color="#00e676"/><stop offset="1" stop-color="#2f8d46" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#00e676" stroke-opacity=".06"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="800" height="440" rx="22" fill="url(#bg)"/><rect width="800" height="440" rx="22" fill="url(#grid)"/>
<text x="40" y="48" text-anchor="start" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" font-weight="800" fill="#00e676" letter-spacing="4">CIRCULAR ARRAYS</text><text x="40" y="82" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#e8fff1" >The best subarray may wrap around the end</text><circle cx="215" cy="252" r="108" fill="none" stroke="#1f6b3d" stroke-width="3" stroke-dasharray="3 7"/><path class="dash" d="M121.5 306 A108 108 0 0 1 215 144" fill="none" stroke="#c6ff00" stroke-width="9" stroke-linecap="round" stroke-dasharray="2 14" filter="url(#glow)"/><g><circle class="pu" cx="215" cy="144" r="34" fill="none" stroke="#c6ff00" stroke-opacity=".35"/><circle cx="215" cy="144" r="30" fill="#06371f" stroke="#c6ff00" stroke-width="2.6"/></g><text x="215" y="152" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="24" font-weight="900" fill="#b9f6ca" >5</text><text x="215" y="102" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10.5" font-weight="700" fill="#7fbf9a" >i=0</text><g><circle class="pu" cx="308.5" cy="306" r="34" fill="none" stroke="#ff6b6b" stroke-opacity=".35"/><circle cx="308.5" cy="306" r="30" fill="#06371f" stroke="#ff6b6b" stroke-width="2.6"/></g><text x="308.5" y="314" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="24" font-weight="900" fill="#ff6b6b" >-3</text><text x="308.5" y="360" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10.5" font-weight="700" fill="#7fbf9a" >i=1</text><g><circle class="pu" cx="121.5" cy="306" r="34" fill="none" stroke="#c6ff00" stroke-opacity=".35"/><circle cx="121.5" cy="306" r="30" fill="#06371f" stroke="#c6ff00" stroke-width="2.6"/></g><text x="121.5" y="314" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="24" font-weight="900" fill="#b9f6ca" >5</text><text x="121.5" y="360" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10.5" font-weight="700" fill="#7fbf9a" >i=2</text><text x="215" y="248" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16" font-weight="900" fill="#c6ff00" >wrap</text><text x="215" y="268" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" font-weight="700" fill="#b9f6ca" >5 + 5 = 10</text><g class="in" style="animation-delay:.2s"><rect x="430" y="110" width="330" height="296" rx="16" fill="#0a2a18" stroke="#1f6b3d" stroke-width="1.6"/><text x="452" y="148" text-anchor="start" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" font-weight="700" fill="#7fbf9a" >array</text><text x="452" y="166" text-anchor="start" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" font-weight="800" fill="#e8fff1" >[ 5, -3, 5 ]</text><text x="452" y="186" text-anchor="start" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" font-weight="700" fill="#7fbf9a" >total</text><text x="452" y="204" text-anchor="start" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" font-weight="800" fill="#e8fff1" >5 - 3 + 5 = 7</text><text x="452" y="224" text-anchor="start" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" font-weight="700" fill="#7fbf9a" >normal Kadane</text><text x="452" y="242" text-anchor="start" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" font-weight="800" fill="#00e676" >7   ([5, -3, 5])</text><text x="452" y="262" text-anchor="start" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" font-weight="700" fill="#7fbf9a" >min subarray</text><text x="452" y="280" text-anchor="start" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" font-weight="800" fill="#ffb300" >-3   (Kadane on -a)</text><text x="452" y="300" text-anchor="start" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" font-weight="700" fill="#7fbf9a" >wrap = total - min</text><text x="452" y="318" text-anchor="start" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" font-weight="800" fill="#c6ff00" >7 - (-3) = 10</text><rect x="452" y="338" width="286" height="46" rx="12" fill="#c6ff00" fill-opacity=".14" stroke="#c6ff00" stroke-width="2"/><text x="595" y="359" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16" font-weight="900" fill="#c6ff00" >answer = max(7, 10) = 10</text><text x="595" y="376" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10.5" font-weight="600" fill="#7fbf9a" >guard: all negative? return normal Kadane</text></g>
<rect x="1" y="1" width="798" height="438" rx="21" fill="none" stroke="#2f8d46" stroke-opacity=".8" stroke-width="2"/>
</svg>
