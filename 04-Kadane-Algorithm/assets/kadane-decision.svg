<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450" role="img" aria-label="Decision flow: if the running sum cur is negative restart from the current element, otherwise extend it" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Decision flow: if the running sum cur is negative restart from the current element, otherwise extend it</title>
<style>.in{animation:in .7s cubic-bezier(.2,.8,.3,1) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.pu{transform-box:fill-box;transform-origin:center;animation:pu 1.4s ease-in-out infinite}
@keyframes pu{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.7);opacity:.4}}
.dash{animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
.blk{animation:bk 1s steps(1) infinite}
@keyframes bk{0%,100%{opacity:1}50%{opacity:0}}
.sh{transform-box:fill-box;transform-origin:center;animation:sh 3.6s ease-in-out infinite}
@keyframes sh{0%{transform:translateX(-40px) skewX(-20deg)}55%,100%{transform:translateX(var(--t)) skewX(-20deg)}}
@media (prefers-reduced-motion:reduce){.in,.pu,.dash,.blk,.sh{animation:none}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#021208"/><stop offset=".55" stop-color="#052e1a"/><stop offset="1" stop-color="#03150b"/></linearGradient>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c6ff00"/><stop offset="1" stop-color="#00e676"/></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f8d46" stop-opacity="0"/><stop offset=".5" stop-color="#00e676"/><stop offset="1" stop-color="#2f8d46" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#00e676" stroke-opacity=".06"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="800" height="450" rx="22" fill="url(#bg)"/><rect width="800" height="450" rx="22" fill="url(#grid)"/>
<text x="40" y="50" text-anchor="start" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" font-weight="800" fill="#00e676" letter-spacing="4">EXTEND OR RESTART?</text><text x="40" y="84" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#e8fff1" >One comparison decides everything</text><path class="dash" d="M400 148 V172" stroke="#b9f6ca" stroke-width="2.4" stroke-dasharray="6 6" fill="none" stroke-linecap="round"/><path class="dash" d="M290 232 H170 V292" stroke="#b9f6ca" stroke-width="2.4" stroke-dasharray="6 6" fill="none" stroke-linecap="round"/><path class="dash" d="M510 232 H630 V292" stroke="#b9f6ca" stroke-width="2.4" stroke-dasharray="6 6" fill="none" stroke-linecap="round"/><g class="in"><rect x="300" y="104" width="200" height="44" rx="12" fill="#0a2a18" stroke="#b9f6ca" stroke-width="1.8"/><text x="400" y="132" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16" font-weight="800" fill="#e8fff1" xml:space="preserve">next element  a[i]</text></g><g class="in" style="animation-delay:.15s"><polygon points="400,172 510,232 400,292 290,232" fill="#031a0e" stroke="#c6ff00" stroke-width="2.2" filter="url(#glow)"/><text x="400" y="230" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="22" font-weight="900" fill="#c6ff00" >cur &lt; 0 ?</text><text x="400" y="252" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" font-weight="600" fill="#7fbf9a" >cur + a[i] &lt; a[i]</text></g><text x="232" y="222" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" font-weight="900" fill="#00e676" >NO</text><text x="568" y="222" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" font-weight="900" fill="#ffb300" >YES</text><g class="in" style="animation-delay:0.3s"><rect x="40" y="292" width="260" height="124" rx="16" fill="#0a2a18" stroke="#00e676" stroke-width="2"/><text x="170" y="324" text-anchor="middle" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="900" fill="#00e676" >EXTEND</text><text x="170" y="348" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" font-weight="800" fill="#e8fff1" >cur = cur + a[i]</text><text x="170" y="370" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#7fbf9a" >keep carrying it - it still helps</text><rect x="56" y="380" width="228" height="26" rx="13" fill="#00e676" fill-opacity=".14" stroke="#00e676"/><text x="170" y="398" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" font-weight="800" fill="#00e676" >cur 3, a[i] 4  =>  7</text></g><g class="in" style="animation-delay:0.5s"><rect x="500" y="292" width="260" height="124" rx="16" fill="#0a2a18" stroke="#ffb300" stroke-width="2"/><text x="630" y="324" text-anchor="middle" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-size="22" font-weight="900" fill="#ffb300" >RESTART</text><text x="630" y="348" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" font-weight="800" fill="#e8fff1" >cur = a[i]</text><text x="630" y="370" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#7fbf9a" >negative baggage only hurts - drop it</text><rect x="516" y="380" width="228" height="26" rx="13" fill="#ffb300" fill-opacity=".14" stroke="#ffb300"/><text x="630" y="398" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12" font-weight="800" fill="#ffb300" >cur -2, a[i] 1  =>  1</text></g><circle r="7" fill="#00e676" filter="url(#glow)"><animateMotion dur="3.6s" repeatCount="indefinite" begin="0s" path="M400 104 V172 L290 232 H170 V292"/><animate attributeName="opacity" dur="3.6s" repeatCount="indefinite" values="0;1;1;0" keyTimes="0;.1;.85;1"/></circle><circle r="7" fill="#ffb300" filter="url(#glow)"><animateMotion dur="3.6s" repeatCount="indefinite" begin="1.8s" path="M400 104 V172 L510 232 H630 V292"/><animate attributeName="opacity" dur="3.6s" repeatCount="indefinite" begin="1.8s" values="0;1;1;0" keyTimes="0;.1;.85;1"/></circle><text x="400" y="432" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="600" fill="#7fbf9a" >max(a[i], cur + a[i])  makes this choice for you, in one line.</text>
<rect x="1" y="1" width="798" height="448" rx="21" fill="none" stroke="#2f8d46" stroke-opacity=".8" stroke-width="2"/>
</svg>
