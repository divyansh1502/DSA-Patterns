<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="230" viewBox="0 0 800 230" role="img" aria-label="Kadane's Algorithm: maximum subarray sum in one pass, O(n) time and O(1) space" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Kadane's Algorithm: maximum subarray sum in one pass, O(n) time and O(1) space</title>
<style>.in{animation:in .7s cubic-bezier(.2,.8,.3,1) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.pu{transform-box:fill-box;transform-origin:center;animation:pu 1.4s ease-in-out infinite}
@keyframes pu{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.7);opacity:.4}}
.dash{animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
.blk{animation:bk 1s steps(1) infinite}
@keyframes bk{0%,100%{opacity:1}50%{opacity:0}}
.sh{transform-box:fill-box;transform-origin:center;animation:sh 3.6s ease-in-out infinite}
@keyframes sh{0%{transform:translateX(-40px) skewX(-20deg)}55%,100%{transform:translateX(var(--t)) skewX(-20deg)}}
@media (prefers-reduced-motion:reduce){.in,.pu,.dash,.blk,.sh{animation:none}}
.bar{transform-box:fill-box;transform-origin:center bottom;animation:gr 1s cubic-bezier(.22,.8,.3,1) both}@keyframes gr{from{transform:scaleY(0)}to{transform:scaleY(1)}}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#021208"/><stop offset=".55" stop-color="#052e1a"/><stop offset="1" stop-color="#03150b"/></linearGradient>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c6ff00"/><stop offset="1" stop-color="#00e676"/></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f8d46" stop-opacity="0"/><stop offset=".5" stop-color="#00e676"/><stop offset="1" stop-color="#2f8d46" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#00e676" stroke-opacity=".06"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="800" height="230" rx="22" fill="url(#bg)"/><rect width="800" height="230" rx="22" fill="url(#grid)"/>
<text x="40" y="78" text-anchor="start" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="22" font-weight="800" fill="#b9f6ca" letter-spacing="8">KADANE'S</text><text x="40" y="136" text-anchor="start" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-size="40" font-weight="900" fill="url(#tg)" filter="url(#glow)">Maximum Subarray</text><text x="42" y="170" text-anchor="start" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="15" font-weight="600" fill="#7fbf9a" >one pass  ·  O(n) time  ·  O(1) space</text><rect x="40" y="188" width="236" height="26" rx="13" fill="#0a2a18" stroke="#1f6b3d"/><circle class="pu" cx="58" cy="201" r="4" fill="#00e676"/><text x="70" y="206" text-anchor="start" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" font-weight="700" fill="#b9f6ca" >cur = max(a[i], cur + a[i])</text><rect class="bar" x="508" y="128" width="22" height="26" rx="5" fill="#ff6b6b" opacity=".75"  style="animation-delay:0s"/><text x="519" y="170" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" font-weight="700" fill="#7fbf9a" >-2</text><rect class="bar" x="538" y="115" width="22" height="13" rx="5" fill="#2f8d46" opacity=".75"  style="animation-delay:0.1s"/><text x="549" y="144" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" font-weight="700" fill="#7fbf9a" >1</text><rect class="bar" x="568" y="128" width="22" height="39" rx="5" fill="#ff6b6b" opacity=".75"  style="animation-delay:0.2s"/><text x="579" y="183" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" font-weight="700" fill="#7fbf9a" >-3</text><rect class="bar" x="598" y="76" width="22" height="52" rx="5" fill="#00e676" opacity="1" filter="url(#glow)" style="animation-delay:0.2s"/><text x="609" y="144" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" font-weight="700" fill="#b9f6ca" >4</text><rect class="bar" x="628" y="128" width="22" height="13" rx="5" fill="#00e676" opacity="1" filter="url(#glow)" style="animation-delay:0.3s"/><text x="639" y="157" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" font-weight="700" fill="#b9f6ca" >-1</text><rect class="bar" x="658" y="102" width="22" height="26" rx="5" fill="#00e676" opacity="1" filter="url(#glow)" style="animation-delay:0.4s"/><text x="669" y="144" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" font-weight="700" fill="#b9f6ca" >2</text><rect class="bar" x="688" y="115" width="22" height="13" rx="5" fill="#00e676" opacity="1" filter="url(#glow)" style="animation-delay:0.5s"/><text x="699" y="144" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" font-weight="700" fill="#b9f6ca" >1</text><rect class="bar" x="718" y="128" width="22" height="65" rx="5" fill="#ff6b6b" opacity=".75"  style="animation-delay:0.6s"/><text x="729" y="209" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" font-weight="700" fill="#7fbf9a" >-5</text><rect class="bar" x="748" y="76" width="22" height="52" rx="5" fill="#2f8d46" opacity=".75"  style="animation-delay:0.6s"/><text x="759" y="144" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" font-weight="700" fill="#7fbf9a" >4</text><line x1="500" y1="128" x2="778" y2="128" stroke="#1f6b3d" stroke-opacity=".5"/><path class="dash" d="M598 70 H710" stroke="#c6ff00" stroke-width="3" stroke-dasharray="6 6" fill="none" stroke-linecap="round"/><text x="654" y="60" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="14" font-weight="800" fill="#c6ff00" >max = 6</text><rect class="sh" x="-60" y="0" width="30" height="230" fill="#fff" fill-opacity=".05" style="--t:900px"/>
<rect x="1" y="1" width="798" height="228" rx="21" fill="none" stroke="#2f8d46" stroke-opacity=".8" stroke-width="2"/>
</svg>
