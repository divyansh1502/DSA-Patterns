<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400" role="img" aria-label="Kadane core idea: at every element either extend the current subarray or restart from the current element" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Kadane core idea: at every element either extend the current subarray or restart from the current element</title>
<style>.in{animation:in .7s cubic-bezier(.2,.8,.3,1) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.pu{transform-box:fill-box;transform-origin:center;animation:pu 1.4s ease-in-out infinite}
@keyframes pu{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.7);opacity:.4}}
.dash{animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
.blk{animation:bk 1s steps(1) infinite}
@keyframes bk{0%,100%{opacity:1}50%{opacity:0}}
.sh{transform-box:fill-box;transform-origin:center;animation:sh 3.6s ease-in-out infinite}
@keyframes sh{0%{transform:translateX(-40px) skewX(-20deg)}55%,100%{transform:translateX(var(--t)) skewX(-20deg)}}
@media (prefers-reduced-motion:reduce){.in,.pu,.dash,.blk,.sh{animation:none}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#021208"/><stop offset=".55" stop-color="#052e1a"/><stop offset="1" stop-color="#03150b"/></linearGradient>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c6ff00"/><stop offset="1" stop-color="#00e676"/></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f8d46" stop-opacity="0"/><stop offset=".5" stop-color="#00e676"/><stop offset="1" stop-color="#2f8d46" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#00e676" stroke-opacity=".06"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="800" height="400" rx="22" fill="url(#bg)"/><rect width="800" height="400" rx="22" fill="url(#grid)"/>
<text x="40" y="52" text-anchor="start" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" font-weight="800" fill="#00e676" letter-spacing="4">THE CORE IDEA</text><text x="40" y="88" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#e8fff1" >At every element, ask one question:</text><text x="40" y="118" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#7fbf9a" >is the sum I am carrying helping the next subarray, or hurting it?</text><g class="in" style="animation-delay:0.1s"><rect x="40" y="140" width="350" height="140" rx="16" fill="#0a2a18" stroke="#00e676" stroke-width="1.6"/><text x="60" y="172" text-anchor="start" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="900" fill="#00e676" >EXTEND</text><text x="60" y="194" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#7fbf9a" >cur is positive → keep carrying it</text><rect x="60" y="212" width="86" height="46" rx="10" fill="#06371f" stroke="#00e676"/><text x="103" y="232" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" font-weight="700" fill="#7fbf9a" >cur</text><text x="103" y="250" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16" font-weight="900" fill="#00e676" >3</text><rect x="160" y="212" width="86" height="46" rx="10" fill="#06371f" stroke="#b9f6ca"/><text x="203" y="232" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" font-weight="700" fill="#7fbf9a" >a[i]</text><text x="203" y="250" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16" font-weight="900" fill="#b9f6ca" >+4</text><path d="M246 235 l12 0 m-5 -5 l5 5 l-5 5" stroke="#00e676" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="268" y="212" width="86" height="46" rx="10" fill="#00e676" fill-opacity=".18" stroke="#00e676" stroke-width="2"/><text x="311" y="232" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" font-weight="700" fill="#00e676" >new cur</text><text x="311" y="250" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16" font-weight="900" fill="#00e676" >7</text></g><g class="in" style="animation-delay:0.2s"><rect x="410" y="140" width="350" height="140" rx="16" fill="#0a2a18" stroke="#ffb300" stroke-width="1.6"/><text x="430" y="172" text-anchor="start" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-size="18" font-weight="900" fill="#ffb300" >RESTART</text><text x="430" y="194" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#7fbf9a" >cur is negative → drop it, start fresh</text><rect x="430" y="212" width="86" height="46" rx="10" fill="#06371f" stroke="#ff6b6b"/><text x="473" y="232" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" font-weight="700" fill="#7fbf9a" >cur</text><text x="473" y="250" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16" font-weight="900" fill="#ff6b6b" >-2</text><rect x="530" y="212" width="86" height="46" rx="10" fill="#06371f" stroke="#b9f6ca"/><text x="573" y="232" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" font-weight="700" fill="#7fbf9a" >a[i]</text><text x="573" y="250" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16" font-weight="900" fill="#b9f6ca" >+1</text><path d="M616 235 l12 0 m-5 -5 l5 5 l-5 5" stroke="#ffb300" stroke-width="2" fill="none" stroke-linecap="round"/><rect x="638" y="212" width="86" height="46" rx="10" fill="#ffb300" fill-opacity=".18" stroke="#ffb300" stroke-width="2"/><text x="681" y="232" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="10" font-weight="700" fill="#ffb300" >new cur</text><text x="681" y="250" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16" font-weight="900" fill="#ffb300" >1</text></g><g class="in" style="animation-delay:.4s"><rect x="40" y="298" width="720" height="78" rx="16" fill="#031a0e" stroke="#1f6b3d"/><text x="66" y="330" text-anchor="start" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="22" font-weight="800" fill="#e8fff1" >cur  = <tspan fill="#c6ff00">max</tspan>( <tspan fill="#ffb300">a[i]</tspan> , <tspan fill="#00e676">cur + a[i]</tspan> )</text><text x="66" y="360" text-anchor="start" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16" font-weight="700" fill="#e8fff1" >best = <tspan fill="#c6ff00">max</tspan>( best , cur )   <tspan fill="#7fbf9a">// never lose the best seen so far</tspan></text><rect class="blk" x="722" y="311" width="9" height="22" rx="2" fill="#00e676"/></g>
<rect x="1" y="1" width="798" height="398" rx="21" fill="none" stroke="#2f8d46" stroke-opacity=".8" stroke-width="2"/>
</svg>
