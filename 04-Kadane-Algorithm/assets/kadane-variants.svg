="700" fill="#b9f6ca" >max(kadane, total - minKadane)</text><rect x="542" y="238" width="204" height="26" rx="13" fill="#69f0ae" fill-opacity=".16" stroke="#69f0ae"/><text x="644" y="256" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" font-weight="800" fill="#69f0ae" >LC 918 · 1191</text></g><g class="in" style="animation-delay:0.3s"><rect x="40" y="298" width="232" height="176" rx="16" fill="#0a2a18" stroke="#b2ff59" stroke-width="1.6"/><g transform="translate(220 308) scale(.8)" fill="none" stroke="#b2ff59" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 6 L38 36 H6 Z"/></g><text x="58" y="332" text-anchor="start" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="900" fill="#b2ff59" >Transformed Array</text><text x="58" y="354" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#7fbf9a" >Kadane on the differences</text><rect x="54" y="376" width="204" height="36" rx="9" fill="#031a0e" stroke="#1f6b3d" stroke-opacity=".5"/><text x="156" y="399" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" font-weight="700" fill="#b9f6ca" >d[i] = a[i] - a[i-1]</text><rect x="54" y="428" width="204" height="26" rx="13" fill="#b2ff59" fill-opacity=".16" stroke="#b2ff59"/><text x="156" y="446" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" font-weight="800" fill="#b2ff59" >LC 121 · 2016 · 2321</text></g><g class="in" style="animation-delay:0.4s"><rect x="284" y="298" width="232" height="176" rx="16" fill="#0a2a18" stroke="#64ffda" stroke-width="1.6"/><g transform="translate(464 308) scale(.8)" fill="none" stroke="#64ffda" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="22" r="7"/><circle cx="34" cy="22" r="7