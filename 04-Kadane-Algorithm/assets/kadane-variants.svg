<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500" role="img" aria-label="Six Kadane styles: classic, min max tracking, circular wrap, transformed array, stateful and reset on break" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Six Kadane styles: classic, min max tracking, circular wrap, transformed array, stateful and reset on break</title>
<style>.in{animation:in .7s cubic-bezier(.2,.8,.3,1) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.pu{transform-box:fill-box;transform-origin:center;animation:pu 1.4s ease-in-out infinite}
@keyframes pu{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.7);opacity:.4}}
.dash{animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
.blk{animation:bk 1s steps(1) infinite}
@keyframes bk{0%,100%{opacity:1}50%{opacity:0}}
.sh{transform-box:fill-box;transform-origin:center;animation:sh 3.6s ease-in-out infinite}
@keyframes sh{0%{transform:translateX(-40px) skewX(-20deg)}55%,100%{transform:translateX(var(--t)) skewX(-20deg)}}
@media (prefers-reduced-motion:reduce){.in,.pu,.dash,.blk,.sh{animation:none}}
</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#021208"/><stop offset=".55" stop-color="#052e1a"/><stop offset="1" stop-color="#03150b"/></linearGradient>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c6ff00"/><stop offset="1" stop-color="#00e676"/></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f8d46" stop-opacity="0"/><stop offset=".5" stop-color="#00e676"/><stop offset="1" stop-color="#2f8d46" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#00e676" stroke-opacity=".06"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
