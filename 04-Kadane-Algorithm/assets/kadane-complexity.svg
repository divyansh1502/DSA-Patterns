<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="430" viewBox="0 0 800 430" role="img" aria-label="Complexity comparison for maximum subarray: brute force O(n cubed), running sum O(n squared), Kadane O(n)" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Complexity comparison for maximum subarray: brute force O(n cubed), running sum O(n squared), Kadane O(n)</title>
<style>.in{animation:in .7s cubic-bezier(.2,.8,.3,1) both}
@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.pu{transform-box:fill-box;transform-origin:center;animation:pu 1.4s ease-in-out infinite}
@keyframes pu{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.7);opacity:.4}}
.dash{animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-14}}
.blk{animation:bk 1s steps(1) infinite}
@keyframes bk{0%,100%{opacity:1}50%{opacity:0}}
.sh{transform-box:fill-box;transform-origin:center;animation:sh 3.6s ease-in-out infinite}
@keyframes sh{0%{transform:translateX(-40px) skewX(-20deg)}55%,100%{transform:translateX(var(--t)) skewX(-20deg)}}
@media (prefers-reduced-motion:reduce){.in,.pu,.dash,.blk,.sh{animation:none}}
.hb{transform-box:fill-box;transform-origin:left center;animation:gh 1.4s cubic-bezier(.22,.8,.3,1) both}@keyframes gh{from{transform:scaleX(0)}to{transform:scaleX(1)}}</style>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#021208"/><stop offset=".55" stop-color="#052e1a"/><stop offset="1" stop-color="#03150b"/></linearGradient>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#c6ff00"/><stop offset="1" stop-color="#00e676"/></linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2f8d46" stop-opacity="0"/><stop offset=".5" stop-color="#00e676"/><stop offset="1" stop-color="#2f8d46" stop-opacity="0"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#00e676" stroke-opacity=".06"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="800" height="430" rx="22" fill="url(#bg)"/><rect width="800" height="430" rx="22" fill="url(#grid)"/>
<text x="40" y="50" text-anchor="start" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" font-weight="800" fill="#00e676" letter-spacing="4">WHY IT MATTERS</text><text x="40" y="86" text-anchor="start" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="800" fill="#e8fff1" >Same answer. Very different cost.</text><text x="40" y="110" text-anchor="start" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" font-weight="600" fill="#7fbf9a" >n = 100,000 elements, roughly 1 billion simple steps per second</text><g class="in" style="animation-delay:0s"><rect x="40" y="134" width="340" height="84" rx="14" fill="#0a2a18" stroke="#ff6b6b" stroke-width="1.6"/><text x="58" y="158" text-anchor="start" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" font-weight="800" fill="#ff6b6b" letter-spacing="2">BRUTE FORCE</text><text x="362" y="160" text-anchor="end" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="900" fill="#ff6b6b" >O(n³)</text><text x="58" y="178" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" font-weight="600" fill="#7fbf9a" xml:space="preserve">for i</text><text x="58" y="191" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" font-weight="600" fill="#e8fff1" xml:space="preserve">  for j</text><text x="58" y="204" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" font-weight="600" fill="#e8fff1" xml:space="preserve">    for k  sum += a[k]</text><rect x="410" y="148" width="350" height="22" rx="11" fill="#031a0e"/><rect class="hb" x="410" y="148" width="360" height="22" rx="11" fill="#ff6b6b" style="animation-delay:0.4s"/><text x="410" y="200" text-anchor="start" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="700" fill="#ff6b6b" >≈ 10^15 steps  ·  about 11 days</text></g><g class="in" style="animation-delay:0.1s"><rect x="40" y="230" width="340" height="84" rx="14" fill="#0a2a18" stroke="#ffb300" stroke-width="1.6"/><text x="58" y="254" text-anchor="start" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" font-weight="800" fill="#ffb300" letter-spacing="2">RUNNING SUM</text><text x="362" y="256" text-anchor="end" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="900" fill="#ffb300" >O(n²)</text><text x="58" y="274" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" font-weight="600" fill="#7fbf9a" xml:space="preserve">for i</text><text x="58" y="287" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" font-weight="600" fill="#e8fff1" xml:space="preserve">  for j  sum += a[j]</text><text x="58" y="300" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" font-weight="600" fill="#e8fff1" xml:space="preserve">        best = max(best, sum)</text><rect x="410" y="244" width="350" height="22" rx="11" fill="#031a0e"/><rect class="hb" x="410" y="244" width="240" height="22" rx="11" fill="#ffb300" style="animation-delay:0.7s"/><text x="410" y="296" text-anchor="start" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="700" fill="#ffb300" >≈ 10^10 steps  ·  about 10 seconds</text></g><g class="in" style="animation-delay:0.3s"><rect x="40" y="326" width="340" height="84" rx="14" fill="#0a2a18" stroke="#00e676" stroke-width="1.6"/><text x="58" y="350" text-anchor="start" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11" font-weight="800" fill="#00e676" letter-spacing="2">KADANE</text><text x="362" y="352" text-anchor="end" font-family="'Arial Black','Segoe UI Black','Helvetica Neue',Arial,sans-serif" font-size="20" font-weight="900" fill="#00e676" >O(n)</text><text x="58" y="370" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" font-weight="600" fill="#7fbf9a" xml:space="preserve">for i</text><text x="58" y="383" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" font-weight="600" fill="#e8fff1" xml:space="preserve">  cur = max(a[i], cur + a[i])</text><text x="58" y="396" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="11.5" font-weight="600" fill="#e8fff1" xml:space="preserve">  best = max(best, cur)</text><rect x="410" y="340" width="350" height="22" rx="11" fill="#031a0e"/><rect class="hb" x="410" y="340" width="120" height="22" rx="11" fill="#00e676" style="animation-delay:1s" filter="url(#glow)"/><text x="410" y="392" text-anchor="start" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="12.5" font-weight="700" fill="#00e676" >≈ 10^5 steps  ·  about 0.1 millisecond</text></g>
<rect x="1" y="1" width="798" height="428" rx="21" fill="none" stroke="#2f8d46" stroke-opacity=".8" stroke-width="2"/>
</svg>
