<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0f0c29"/><stop offset="100%" stop-color="#302b63"/></linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#00f5d4"/><stop offset="100%" stop-color="#ff5ecb"/></linearGradient>
  </defs>
  <rect width="800" height="380" rx="24" fill="url(#bg2)"/>
  <text x="400" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#e0e7ff">Floyd's Cycle Detection — watch them collide</text>

  <!-- structure -->
  <line x1="80" y1="200" x2="370" y2="200" stroke="#6C63FF" stroke-width="4" stroke-dasharray="8 6"><animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.5s" repeatCount="indefinite"/></line>
  <circle cx="480" cy="200" r="110" fill="none" stroke="url(#ring)" stroke-width="4" stroke-dasharray="10 7"><animate attributeName="stroke-dashoffset" from="0" to="-34" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="80" cy="200" r="9" fill="#a78bfa"/>
  <circle cx="370" cy="200" r="11" fill="#00f5d4"><animate attributeName="r" values="11;16;11" dur="1.6s" repeatCount="indefinite"/></circle>
  <text x="80" y="235" text-anchor="middle" font-size="14" fill="#c4b5fd">head</text>
  <text x="370" y="240" text-anchor="middle" font-size="14" fill="#00f5d4">cycle entry</text>
  <text x="225" y="182" text-anchor="middle" font-size="14" fill="#c4b5fd">tail  (length = a)</text>
  <text x="480" y="205" text-anchor="middle" font-size="16" fill="#ff5ecb" font-weight="700">cycle</text>
  <text x="480" y="225" text-anchor="middle" font-size="13" fill="#c4b5fd">length = c</text>

  <!-- tortoise: tail + 1 loop -->
  <g><animateMotion dur="14s" repeatCount="indefinite" path="M80,200 L370,200 A110,110 0 0 1 590,200 A110,110 0 0 1 370,200"/>
    <circle r="13" fill="#1e1b4b" stroke="#00f5d4" stroke-width="3"/><text y="6" text-anchor="middle" font-size="16">🐢</text></g>
  <!-- hare: 2x speed -->
  <g><animateMotion dur="14s" repeatCount="indefinite" path="M80,200 L370,200 A110,110 0 0 1 590,200 A110,110 0 0 1 370,200 A110,110 0 0 1 590,200 A110,110 0 0 1 370,200 A110,110 0 0 1 575.3,125"/>
    <circle r="13" fill="#1e1b4b" stroke="#ff5ecb" stroke-width="3"/><text y="6" text-anchor="middle" font-size="16">🐇</text></g>

  <!-- legend -->
  <g font-size="14" fill="#e0e7ff">
    <circle cx="90" cy="322" r="7" fill="#00f5d4"/><text x="105" y="327">slow: 1 step / tick</text>
    <circle cx="90" cy="348" r="7" fill="#ff5ecb"/><text x="105" y="353">fast: 2 steps / tick</text>
    <text x="330" y="327" fill="#a78bfa">Phase 1 → they meet inside the cycle  (proves a loop exists)</text>
    <text x="330" y="353" fill="#a78bfa">Phase 2 → reset one to head, move both +1 → meet at entry</text>
  </g>
</svg>
