<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" font-family="'Segoe UI',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"><animate attributeName="stop-color" values="#0f0c29;#1b1464;#0f0c29" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="50%" stop-color="#302b63"><animate attributeName="stop-color" values="#302b63;#6C63FF;#302b63" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#24243e"><animate attributeName="stop-color" values="#24243e;#0f0c29;#24243e" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f5d4"/><stop offset="50%" stop-color="#a78bfa"/><stop offset="100%" stop-color="#ff5ecb"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-0.5 0;0.5 0;-0.5 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a78bfa"/></marker>
  </defs>

  <rect width="900" height="320" rx="24" fill="url(#bg)"/>

  <!-- sparkles -->
  <g fill="#fff">
    <circle cx="80" cy="50" r="2"><animate attributeName="opacity" values="0;1;0" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="40" r="2.5"><animate attributeName="opacity" values="0;1;0" dur="4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="700" cy="90" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="2.5s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="95" r="1.8"><animate attributeName="opacity" values="0;1;0" dur="3.5s" begin="2s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="28" r="2"><animate attributeName="opacity" values="0;1;0" dur="3s" begin="1.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- title -->
  <text x="450" y="112" text-anchor="middle" font-size="54" font-weight="800" fill="url(#title)" filter="url(#glow)">Slow &amp; Fast Pointers</text>
  <text x="450" y="152" text-anchor="middle" font-size="19" fill="#c4b5fd" letter-spacing="3">FLOYD'S TORTOISE &amp; HARE  ·  LINKED LIST EDITION</text>
  <rect x="330" y="170" width="240" height="3" rx="2" fill="url(#title)"><animate attributeName="width" values="40;240;40" dur="4s" repeatCount="indefinite"/><animate attributeName="x" values="430;330;430" dur="4s" repeatCount="indefinite"/></rect>

  <!-- linked list -->
  <g stroke="#a78bfa" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="170" y1="262" x2="215" y2="262"/><line x1="275" y1="262" x2="325" y2="262"/>
    <line x1="385" y1="262" x2="435" y2="262"/><line x1="495" y1="262" x2="545" y2="262"/>
    <line x1="605" y1="262" x2="655" y2="262"/><line x1="715" y1="262" x2="765" y2="262"/>
  </g>
  <g>
    <g id="n"><rect x="110" y="244" width="60" height="36" rx="10" fill="#1e1b4b" stroke="#6C63FF" stroke-width="2"/></g>
    <rect x="220" y="244" width="60" height="36" rx="10" fill="#1e1b4b" stroke="#6C63FF" stroke-width="2"/>
    <rect x="330" y="244" width="60" height="36" rx="10" fill="#1e1b4b" stroke="#6C63FF" stroke-width="2"/>
    <rect x="440" y="244" width="60" height="36" rx="10" fill="#1e1b4b" stroke="#00f5d4" stroke-width="2.5"><animate attributeName="stroke-opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/></rect>
    <rect x="550" y="244" width="60" height="36" rx="10" fill="#1e1b4b" stroke="#6C63FF" stroke-width="2"/>
    <rect x="660" y="244" width="60" height="36" rx="10" fill="#1e1b4b" stroke="#6C63FF" stroke-width="2"/>
    <rect x="770" y="244" width="60" height="36" rx="10" fill="#1e1b4b" stroke="#6C63FF" stroke-width="2"/>
  </g>
  <g fill="#e0e7ff" font-size="16" font-weight="700" text-anchor="middle">
    <text x="140" y="268">1</text><text x="250" y="268">2</text><text x="360" y="268">3</text>
    <text x="470" y="268" fill="#00f5d4">4</text><text x="580" y="268">5</text><text x="690" y="268">6</text><text x="800" y="268">7</text>
  </g>

  <!-- runners -->
  <g transform="translate(125,232)">
    <g><animateMotion path="M0,0 L660,0" dur="14s" repeatCount="indefinite"/><text font-size="28" text-anchor="middle">🐢</text></g>
  </g>
  <g transform="translate(125,208)">
    <g><animateMotion path="M0,0 L660,0" dur="7s" repeatCount="indefinite"/><text font-size="28" text-anchor="middle">🐇</text></g>
  </g>
  <text x="45" y="237" font-size="12" fill="#a78bfa" text-anchor="middle">slow +1</text>
  <text x="45" y="213" font-size="12" fill="#ff5ecb" text-anchor="middle">fast +2</text>
</svg>
