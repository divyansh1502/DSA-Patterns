" font-weight="800" fill="#d9ffe8" opacity="0"><animate attributeName="opacity" values="0;1;0;0;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" calcMode="discrete" dur="13.799999999999999s" repeatCount="indefinite"/>3 + 18 = 21  &lt;  22  →  too small, move L right</text><text x="400" y="270" text-anchor="middle" font-size="22" font-weight="800" fill="#d9ffe8" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" calcMode="discrete" dur="13.799999999999999s" repeatCount="indefinite"/>5 + 18 = 23  &gt;  22  →  too big, move R left</text><text x="400" y="270" text-anchor="middle" font-size="22" font-weight="800" fill="#d9ffe8" opacity="0"><animate attributeName="opacity" values="0;0;0;1;0;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" calcMode="discrete" dur="13.799999999999999s" repeatCount="indefinite"/>5 + 14 = 19  &lt;  22  →  too small, move L right</text><text x="400" y="270" text-anchor="middle" font-size="22" font-weight="800" fill="#00e676" opacity="0"><animate attributeName="opacity" values="0;0;0;0;1;0" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" calcMode="discrete" dur="13.799999999999999s" repeatCount="indefinite"/>8 + 14 = 22  =  target  ✓  found!</text><text x="400" y="270" text-anchor="middle" font-size="22" font-weight="800" fill="#00e676" opacity="0"><animate attributeName="opacity" values="0;0;0;0;0;1" keyTimes="0.0000;0.1667;0.3333;0.5000;0.6667;0.8333" calcMode="discrete" dur="13.799999999999999s" repeatCount="indefinite"/>8 + 14 = 22  =  target  ✓  found!</text><text x="400" y="305" text-anchor="middle" font-size="14" fill="#7ee2a8">each step discards one element for good → O(n)</text></svg>