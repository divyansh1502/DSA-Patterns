" r="26" fill="#7c5cff" filter="url(#glow)"><animate attributeName="r" values="26;30;26" dur="2.4s" begin="0.2s" repeatCount="indefinite"/></circle><text x="275" y="108" text-anchor="middle" font-size="22" font-weight="900" fill="#060a1a">✓</text><text x="275" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ecff">Two Pointers</text><circle cx="450" cy="100" r="26" fill="#ff5ecb" filter="url(#glow)"><animate attributeName="r" values="26;30;26" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle><text x="450" y="108" text-anchor="middle" font-size="22" font-weight="900" fill="#060a1a">✓</text><text x="450" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ecff">Sliding Window</text><circle cx="625" cy="100" r="26" fill="#ffd166" filter="url(#glow)"><animate attributeName="r" values="26;30;26" dur="2.4s" begin="0.6000000000000001s" repeatCount="indefinite"/></circle><text x="625" y="108" text-anchor="middle" font-size="22" font-weight="900" fill="#060a1a">✓</text><text x="625" y="152" text-anchor="middle" font-size="13" font-weight="700" fill="#e8ecff">Fast &amp; Slow</text><circle cx="800" cy="100" r="26" fill="#0d1030" stroke="#4cc9f0" stroke-width="2.5"/><text x="800" y="107" text-anchor="middle" font-size="18" font-weight="800" fill="#4cc9f0">05</text><text x="800" y="152" text-anchor="middle" font-size="13" font-weight="500" fill="#9aa4d9">Merge Intervals</text><circle cx="800" cy="225" r="26" fill="#0d1030" stroke="#00f5d4" stroke-width="2.5"/><text x="800" y="232" text-anchor="middle" font-size="18" font-weight="800" fill="#00f5d4">06</text><text x="800" y="277" text-anchor="middle" font-size="13" font-weight="500" fill="#9aa4d9">Stack</text><circle cx="625" cy="225" r="26" fill="#0d1030" stroke="#7c5cff" stroke-width="2.5"/><text x="625" y="232" text-anchor="middle" font-size="18" font-weight="800" fill="#7c5cff">07</text><text x="625" y="277" text-anchor="middle" font-size="13" font-weight="500" fill="#9aa4d9"